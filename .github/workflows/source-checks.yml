name: Verify experimental source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact upstream base
        shell: bash
        run: |
          git init work/upstream
          git -C work/upstream fetch --depth=1 https://github.com/Djihads80/Eglantine.git 6bde8c20d1f7c020a920e59a989c03822a08445d
      - name: Verify patches, code and public files
        run: python3 tools/verify_source.py --upstream work/upstream
      - name: Test heap accounting invariants
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I modified/src/video_core/vulkan_common tests/heap_accounting_test.cpp -o work/heap-test
          work/heap-test
      - name: Test HTTP security fixes with a vulnerable-version control
        run: python3 tools/check_http_regressions.py
